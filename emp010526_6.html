<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal VIP | Sotere Imóveis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hero-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        
        /* Efeito Neon para Decorado e Modelo */
        .neon-green {
            box-shadow: 0 0 5px #4ade80, 0 0 10px #4ade80;
            animation: pulse-green 2s infinite;
        }
        .neon-purple {
            box-shadow: 0 0 5px #a855f7, 0 0 10px #a855f7;
            animation: pulse-purple 2s infinite;
        }
        @keyframes pulse-green { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; shadow: 0 0 15px #4ade80; } }
        @keyframes pulse-purple { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; shadow: 0 0 15px #a855f7; } }

        .card-shadow { transition: all 0.3s ease; border: 1px solid #f1f5f9; }
        .card-shadow:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); border-color: #3b82f6; }
        
        select { cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <header class="hero-bg text-white py-12">
        <div class="container mx-auto px-6">
            <h1 class="text-3xl font-black uppercase tracking-tighter italic">Sotere <span class="text-blue-500">Imóveis</span></h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Inteligência Imobiliária ABC & Litoral</p>
        </div>
    </header>

    <!-- PAINEL DE CONTROLE (FILTROS) -->
    <section class="container mx-auto -mt-10 px-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block"><i class="fa-solid fa-city mr-1 text-blue-500"></i> Cidade</label>
                    <select id="f-cidade" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm"></select>
                </div>
                <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block"><i class="fa-solid fa-map-location-dot mr-1 text-blue-500"></i> Bairro</label>
                    <select id="f-bairro" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm"><option value="">Todos os bairros</option></select>
                </div>
                <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block"><i class="fa-solid fa-building mr-1 text-blue-500"></i> Construtora</label>
                    <select id="f-construtora" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm"></select>
                </div>
                <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block"><i class="fa-solid fa-magnifying-glass mr-1 text-blue-500"></i> Nome</label>
                    <input type="text" id="f-nome" placeholder="Buscar empreendimento..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 py-6 border-y border-slate-100">
                <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block">Dormitórios</label>
                    <select id="f-dorm" class="w-full p-2.5 border rounded-xl font-bold bg-white text-xs">
                        <option value="">Qualquer</option>
                        <option value="1">1 Dorm</option>
                        <option value="2">2 Dorms</option>
                        <option value="3">3 Dorms</option>
                        <option value="4">4 ou mais</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block">Suítes</label>
                    <select id="f-suite" class="w-full p-2.5 border rounded-xl font-bold bg-white text-xs">
                        <option value="">Qualquer</option>
                        <option value="1">1 Suíte</option>
                        <option value="2">2 Suítes</option>
                        <option value="3">3 Suítes</option>
                        <option value="4">4 ou mais</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block">Vagas</label>
                    <select id="f-vaga" class="w-full p-2.5 border rounded-xl font-bold bg-white text-xs">
                        <option value="">Qualquer</option>
                        <option value="1">1 Vaga</option>
                        <option value="2">2 Vagas</option>
                        <option value="3">3 Vagas</option>
                        <option value="4">4 ou mais</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block">Valor Máx</label>
                    <input type="number" id="f-valor" placeholder="Ex: 900000" class="w-full p-2.5 border rounded-xl font-bold bg-white text-xs">
                </div>
                <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block">Área Mín (m²)</label>
                    <input type="number" id="f-area" placeholder="Ex: 50" class="w-full p-2.5 border rounded-xl font-bold bg-white text-xs">
                </div>
            </div>

            <div class="mt-8 flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex flex-wrap gap-4 items-center">
                    <label class="flex items-center gap-2 text-xs font-black uppercase"><input type="checkbox" value="Lançamento" class="chk-status w-4 h-4" checked> <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Lançamento</label>
                    <label class="flex items-center gap-2 text-xs font-black uppercase"><input type="checkbox" value="Em obra" class="chk-status w-4 h-4" checked> <span class="w-2 h-2 rounded-full bg-orange-500"></span> Obra</label>
                    <label class="flex items-center gap-2 text-xs font-black uppercase"><input type="checkbox" value="Pronto" class="chk-status w-4 h-4" checked> <span class="w-2 h-2 rounded-full bg-blue-500"></span> Pronto</label>
                    <label class="flex items-center gap-2 text-xs font-black uppercase text-slate-400"><input type="checkbox" id="chk-indisp" class="w-4 h-4"> <span class="w-2 h-2 rounded-full bg-slate-400"></span> Indisponíveis</label>
                </div>
                <div class="flex gap-4 items-center">
                    <label class="flex items-center gap-2 text-xs font-black text-emerald-600 uppercase"><input type="checkbox" id="f-decorado" class="w-4 h-4"> Decorado</label>
                    <label class="flex items-center gap-2 text-xs font-black text-purple-600 uppercase"><input type="checkbox" id="f-modelo" class="w-4 h-4"> Modelo</label>
                </div>
            </div>
        </div>
    </section>

    <!-- BARRA DE ORDENAÇÃO -->
    <section class="container mx-auto px-4 mt-12 flex flex-col md:flex-row justify-between items-center bg-slate-100 p-4 rounded-2xl border border-slate-200">
        <div class="text-xs font-black uppercase text-slate-500 mb-4 md:mb-0">
            <span id="counter" class="text-blue-600">0</span> empreendimentos encontrados
        </div>
        <div class="flex items-center gap-3">
            <label class="text-[10px] font-black uppercase text-slate-400">Ordenar por:</label>
            <select id="f-ordem" class="bg-white border border-slate-300 rounded-lg px-4 py-2 text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500">
                <option value="nome">Nome (A-Z)</option>
                <option value="p-menor">Menor Preço</option>
                <option value="p-maior">Maior Preço</option>
                <option value="a-maior">Maior Área</option>
                <option value="a-menor">Menor Área</option>
            </select>
        </div>
    </section>

    <!-- GRID DE RESULTADOS -->
    <main class="container mx-auto px-4 py-12">
        <div id="grid-imoveis" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </main>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3hyyGVCdrDnwRw0jq6AzUBvZtuuUxGswfYuMhWvBvUoA7wsMZRt2hNq3PdxFLd3nv8M7Sxm0MTLyN/pub?gid=0&single=true&output=csv';
        let imoveis = [];

        async function carregar() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const linhas = text.split('\n').filter(l => l.trim());
                const cabecalho = linhas[0].toLowerCase().split(',').map(h => h.trim().replace(/"/g, ''));
                
                imoveis = linhas.slice(1).map(linha => {
                    const col = linha.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    let obj = {};
                    cabecalho.forEach((h, i) => {
                        let v = (col[i] || "").replace(/"/g, '').trim();
                        if (['dorm','suite','vaga','area'].includes(h)) obj[h] = parseInt(v) || 0;
                        else if (h.includes('valor')) obj['valor'] = parseFloat(v.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                        else obj[h] = v;
                    });
                    return obj;
                });

                popularFiltros();
                setupEvents();
                filtrarEOrdenar();
                updateStatus(true);
            } catch (e) { updateStatus(false); }
        }

        function popularFiltros() {
            const getVals = (campo) => [...new Set(imoveis.map(i => i[campo]))].filter(Boolean).sort();
            const fill = (id, list, label) => {
                document.getElementById(id).innerHTML = `<option value="">${label}</option>` + list.map(v => `<option value="${v}">${v}</option>`).join('');
            };
            fill('f-cidade', getVals('cidade'), 'Todas as cidades');
            fill('f-construtora', getVals('construtora'), 'Todas as Construtoras');
        }

        function setupEvents() {
            const inputs = ['f-cidade', 'f-bairro', 'f-construtora', 'f-nome', 'f-dorm', 'f-suite', 'f-vaga', 'f-valor', 'f-area', 'f-ordem', 'chk-indisp', 'f-decorado', 'f-modelo'];
            inputs.forEach(id => document.getElementById(id).addEventListener('change', filtrarEOrdenar));
            document.getElementById('f-nome').addEventListener('input', filtrarEOrdenar);
            document.querySelectorAll('.chk-status').forEach(c => c.addEventListener('change', filtrarEOrdenar));

            document.getElementById('f-cidade').addEventListener('change', (e) => {
                const bairros = [...new Set(imoveis.filter(i => !e.target.value || i.cidade === e.target.value).map(i => i.bairro))].filter(Boolean).sort();
                document.getElementById('f-bairro').innerHTML = '<option value="">Todos os bairros</option>' + bairros.map(b => `<option value="${b}">${b}</option>`).join('');
            });
        }

        function filtrarEOrdenar() {
            const f = {
                cidade: document.getElementById('f-cidade').value,
                bairro: document.getElementById('f-bairro').value,
                construtora: document.getElementById('f-construtora').value,
                nome: document.getElementById('f-nome').value.toLowerCase(),
                dorm: document.getElementById('f-dorm').value,
                suite: document.getElementById('f-suite').value,
                vaga: document.getElementById('f-vaga').value,
                valor: parseFloat(document.getElementById('f-valor').value) || Infinity,
                area: parseInt(document.getElementById('f-area').value) || 0,
                status: [...document.querySelectorAll('.chk-status:checked')].map(c => c.value),
                indisp: document.getElementById('chk-indisp').checked,
                decorado: document.getElementById('f-decorado').checked,
                modelo: document.getElementById('f-modelo').checked,
                ordem: document.getElementById('f-ordem').value
            };

            let filtrados = imoveis.filter(i => {
                const statusEfetivo = i.disponivel === 'Não' ? 'Indisponível' : i.status;
                if (f.cidade && i.cidade !== f.cidade) return false;
                if (f.bairro && i.bairro !== f.bairro) return false;
                if (f.construtora && i.construtora !== f.construtora) return false;
                if (f.nome && !i.empreendimento.toLowerCase().includes(f.nome)) return false;
                
                // Lógica 4+
                if (f.dorm === "4") { if (i.dorm < 4) return false; } else if (f.dorm && i.dorm != f.dorm) return false;
                if (f.suite === "4") { if (i.suite < 4) return false; } else if (f.suite && i.suite != f.suite) return false;
                if (f.vaga === "4") { if (i.vaga < 4) return false; } else if (f.vaga && i.vaga != f.vaga) return false;

                if (i.valor > f.valor || i.area < f.area) return false;
                if (f.decorado && i.decorado !== 'Sim') return false;
                if (f.modelo && i.modelo !== 'Sim') return false;
                if (statusEfetivo === 'Indisponível') return f.indisp;
                return f.status.includes(statusEfetivo);
            });

            // Ordenação
            filtrados.sort((a, b) => {
                if (f.ordem === 'p-menor') return a.valor - b.valor;
                if (f.ordem === 'p-maior') return b.valor - a.valor;
                if (f.ordem === 'a-maior') return b.area - a.area;
                if (f.ordem === 'a-menor') return a.area - b.area;
                return a.empreendimento.localeCompare(b.empreendimento);
            });

            document.getElementById('counter').innerText = filtrados.length;
            render(filtrados);
        }

        function render(lista) {
            const grid = document.getElementById('grid-imoveis');
            grid.innerHTML = lista.map(i => {
                const m2 = i.valor / i.area;
                const statusColor = i.disponivel === 'Não' ? 'bg-slate-400' : (i.status === 'Lançamento' ? 'bg-emerald-500' : (i.status === 'Pronto' ? 'bg-blue-500' : 'bg-orange-500'));
                
                return `
                <div class="bg-white rounded-[2.5rem] card-shadow overflow-hidden flex flex-col ${i.disponivel === 'Não' ? 'grayscale opacity-70' : ''}">
                    <div class="p-8">
                        <div class="flex justify-between items-start mb-6">
                            <div class="max-w-[70%]">
                                <h4 class="font-black text-slate-800 text-xl leading-tight uppercase tracking-tighter">${i.empreendimento}</h4>
                                <p class="text-[10px] text-slate-400 font-bold uppercase mt-1"><i class="fa-solid fa-location-dot text-red-400 mr-1"></i>${i.bairro} — ${i.cidade}</p>
                            </div>
                            <span class="${statusColor} text-white text-[9px] font-black px-3 py-1.5 rounded-full uppercase tracking-widest">${i.disponivel === 'Não' ? 'Indisponível' : i.status}</span>
                        </div>

                        <!-- GRID TÉCNICO -->
                        <div class="grid grid-cols-2 gap-3 mb-8">
                            <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-blue-500 shadow-sm"><i class="fa-solid fa-bed text-xs"></i></div>
                                <div><p class="text-[8px] text-slate-400 font-bold uppercase leading-none">Dorms</p><p class="text-sm font-black text-slate-700">${i.dorm}</p></div>
                            </div>
                            <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-orange-500 shadow-sm"><i class="fa-solid fa-bath text-xs"></i></div>
                                <div><p class="text-[8px] text-slate-400 font-bold uppercase leading-none">Suítes</p><p class="text-sm font-black text-slate-700">${i.suite}</p></div>
                            </div>
                            <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-emerald-500 shadow-sm"><i class="fa-solid fa-car text-xs"></i></div>
                                <div><p class="text-[8px] text-slate-400 font-bold uppercase leading-none">Vagas</p><p class="text-sm font-black text-slate-700">${i.vaga}</p></div>
                            </div>
                            <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                                <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-purple-500 shadow-sm"><i class="fa-solid fa-ruler-combined text-xs"></i></div>
                                <div><p class="text-[8px] text-slate-400 font-bold uppercase leading-none">Planta</p><p class="text-sm font-black text-slate-700">${i.area}m²</p></div>
                            </div>
                        </div>

                        <div class="mb-6">
                            <p class="text-[9px] text-slate-400 font-black uppercase tracking-widest mb-1">Valor a partir de:</p>
                            <div class="flex items-end gap-3">
                                <h3 class="text-2xl font-black text-blue-600 leading-none">R$ ${i.valor.toLocaleString('pt-BR')}</h3>
                                <span class="text-[10px] text-slate-300 font-bold border-l pl-3">${m2.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}/m²</span>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-3 mb-8">
                            <span class="px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest border border-slate-100 bg-slate-50 text-slate-400"><i class="fa-solid fa-hammer mr-1"></i>${i.construtora}</span>
                            ${i.decorado === 'Sim' ? '<span class="px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest bg-emerald-500 text-white neon-green"><i class="fa-solid fa-couch mr-1"></i>Decorado</span>' : '<span class="px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest bg-slate-100 text-slate-300">Sem Decorado</span>'}
                            ${i.modelo === 'Sim' ? '<span class="px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest bg-purple-600 text-white neon-purple"><i class="fa-solid fa-eye mr-1"></i>Modelo</span>' : ''}
                        </div>

                        <div class="flex gap-3">
                            <a href="${i['link empreendimento']}" target="_blank" class="flex-1 bg-slate-900 text-white text-center py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-black transition-all shadow-xl shadow-slate-200">Visitar Site</a>
                            ${i.book ? `<a href="${i.book}" target="_blank" class="flex-1 bg-blue-50 text-blue-600 text-center py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-blue-100 transition-all border border-blue-100">Baixar Book</a>` : ''}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function updateStatus(ok) {
            const dot = document.getElementById('dot-sync'), txt = document.getElementById('status-sync');
            if(!dot) return;
            dot.className = ok ? "w-2 h-2 bg-green-500 rounded-full animate-pulse" : "w-2 h-2 bg-red-500 rounded-full";
        }

        carregar();
    </script>
</body>
</html>
