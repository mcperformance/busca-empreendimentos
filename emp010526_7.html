<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Marcelo Conti | Facilitador Imobiliário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-g: #4ade80; --neon-p: #a855f7; }
        .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        
        /* Neons Pulsantes */
        .neon-decorado { 
            box-shadow: 0 0 8px var(--neon-g); 
            animation: pulse-g 2s infinite;
            border: 1px solid var(--neon-g);
        }
        .neon-modelo { 
            box-shadow: 0 0 8px var(--neon-p); 
            animation: pulse-p 2s infinite;
            border: 1px solid var(--neon-p);
        }
        @keyframes pulse-g { 0%, 100% { box-shadow: 0 0 5px var(--neon-g); } 50% { box-shadow: 0 0 15px var(--neon-g); } }
        @keyframes pulse-p { 0%, 100% { box-shadow: 0 0 5px var(--neon-p); } 50% { box-shadow: 0 0 15px var(--neon-p); } }

        .card-entry { transition: transform 0.2s; }
        @media (min-width: 1024px) { .card-entry:hover { transform: translateY(-5px); } }
        
        /* Ajuste para inputs no mobile */
        input, select { font-size: 16px !important; } 
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans leading-tight">

    <!-- CABEÇALHO PERSONALIZADO -->
    <header class="hero-gradient text-white py-10 pb-20">
        <div class="container mx-auto px-6 text-center md:text-left">
            <h1 class="text-2xl md:text-4xl font-black tracking-tighter uppercase">
                Portal de Empreendimentos <span class="text-blue-400">| Marcelo Conti</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-base font-medium mt-2 max-w-2xl">
                O seu facilitador estratégico para encontrar as melhores opções para seus clientes.
            </p>
        </div>
    </header>

    <!-- PAINEL DE FILTROS RESPONSIVO -->
    <section class="container mx-auto -mt-12 px-4">
        <div class="bg-white rounded-[2rem] shadow-2xl p-5 md:p-8 border border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Cidade</label>
                    <select id="f-cidade" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500"></select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Bairro</label>
                    <select id="f-bairro" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Construtora</label>
                    <select id="f-construtora" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500"></select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Nome do Prédio</label>
                    <input type="text" id="f-nome" placeholder="Ex: Patriani..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 pt-6 border-t border-slate-100">
                <select id="f-dorm" class="p-3 border rounded-2xl font-bold bg-white text-xs"><option value="">Dorms</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
                <select id="f-suite" class="p-3 border rounded-2xl font-bold bg-white text-xs"><option value="">Suítes</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
                <select id="f-vaga" class="p-3 border rounded-2xl font-bold bg-white text-xs"><option value="">Vagas</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
                <input type="number" id="f-valor" placeholder="Preço Máx" class="p-3 border rounded-2xl font-bold bg-white text-xs">
                <input type="number" id="f-area" placeholder="m² Mín" class="p-3 border rounded-2xl font-bold bg-white text-xs">
            </div>

            <div class="mt-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex flex-wrap justify-center gap-3">
                    <label class="flex items-center gap-2 text-[10px] font-black uppercase bg-slate-50 px-3 py-2 rounded-full border"><input type="checkbox" value="Lançamento" class="chk-status" checked> Lançamento</label>
                    <label class="flex items-center gap-2 text-[10px] font-black uppercase bg-slate-50 px-3 py-2 rounded-full border"><input type="checkbox" value="Em obra" class="chk-status" checked> Em obra</label>
                    <label class="flex items-center gap-2 text-[10px] font-black uppercase bg-slate-50 px-3 py-2 rounded-full border"><input type="checkbox" value="Pronto" class="chk-status" checked> Pronto</label>
                    <label class="flex items-center gap-2 text-[10px] font-black uppercase bg-slate-50 px-3 py-2 rounded-full border text-slate-400"><input type="checkbox" id="chk-indisp"> Indisponíveis</label>
                </div>
                <div class="flex w-full md:w-auto gap-2">
                    <button onclick="limpar()" class="flex-1 md:flex-none bg-slate-200 text-slate-600 font-black px-6 py-3 rounded-2xl text-[10px] uppercase tracking-widest hover:bg-slate-300">Limpar</button>
                    <button onclick="filtrarEOrdenar()" class="flex-[2] md:flex-none bg-blue-600 text-white font-black px-10 py-3 rounded-2xl text-[10px] uppercase tracking-widest shadow-lg shadow-blue-200">Filtrar</button>
                </div>
            </div>
        </div>
    </section>

    <!-- BARRA DE RESULTADOS -->
    <section class="container mx-auto px-4 mt-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-[10px] font-black uppercase text-slate-400 tracking-widest">
            <span id="counter" class="text-blue-600 text-lg mr-1">0</span> Opções encontradas
        </div>
        <select id="f-ordem" class="w-full md:w-auto bg-white border rounded-xl px-4 py-2 text-xs font-black shadow-sm outline-none">
            <option value="nome">Ordenar: Nome (A-Z)</option>
            <option value="p-menor">Menor Preço</option>
            <option value="p-maior">Maior Preço</option>
            <option value="a-maior">Maior Área</option>
        </select>
    </section>

    <!-- GRID DE CARDS -->
    <main class="container mx-auto px-4 py-8">
        <div id="grid-imoveis" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8"></div>
    </main>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3hyyGVCdrDnwRw0jq6AzUBvZtuuUxGswfYuMhWvBvUoA7wsMZRt2hNq3PdxFLd3nv8M7Sxm0MTLyN/pub?gid=0&single=true&output=csv';
        let imoveis = [];

        async function carregar() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const linhas = text.split('\n').filter(l => l.trim());
                const cabecalho = linhas[0].toLowerCase().split(',').map(h => h.trim().replace(/"/g, ''));
                
                imoveis = linhas.slice(1).map(linha => {
                    const col = linha.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    let obj = {};
                    cabecalho.forEach((h, i) => {
                        let v = (col[i] || "").replace(/"/g, '').trim();
                        if (['dorm','suite','vaga','area'].includes(h)) obj[h] = parseInt(v) || 0;
                        else if (h.includes('valor')) obj['valor'] = parseFloat(v.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                        else obj[h] = v;
                    });
                    return obj;
                });

                popularFiltros();
                setupEvents();
                filtrarEOrdenar();
            } catch (e) { console.error("Erro ao carregar dados", e); }
        }

        function popularFiltros() {
            const getVals = (campo) => [...new Set(imoveis.map(i => i[campo]))].filter(Boolean).sort();
            const fill = (id, list, label) => {
                document.getElementById(id).innerHTML = `<option value="">${label}</option>` + list.map(v => `<option value="${v}">${v}</option>`).join('');
            };
            fill('f-cidade', getVals('cidade'), 'Todas as cidades');
            fill('f-construtora', getVals('construtora'), 'Todas as Construtoras');
        }

        function setupEvents() {
            document.getElementById('f-cidade').addEventListener('change', (e) => {
                const bairros = [...new Set(imoveis.filter(i => !e.target.value || i.cidade === e.target.value).map(i => i.bairro))].filter(Boolean).sort();
                document.getElementById('f-bairro').innerHTML = '<option value="">Todos</option>' + bairros.map(b => `<option value="${b}">${b}</option>`).join('');
                filtrarEOrdenar();
            });
            ['f-bairro', 'f-construtora', 'f-ordem', 'f-dorm', 'f-suite', 'f-vaga'].forEach(id => {
                document.getElementById(id).addEventListener('change', filtrarEOrdenar);
            });
            document.getElementById('f-nome').addEventListener('input', filtrarEOrdenar);
        }

        function filtrarEOrdenar() {
            const f = {
                cidade: document.getElementById('f-cidade').value,
                bairro: document.getElementById('f-bairro').value,
                construtora: document.getElementById('f-construtora').value,
                nome: document.getElementById('f-nome').value.toLowerCase(),
                dorm: document.getElementById('f-dorm').value,
                suite: document.getElementById('f-suite').value,
                vaga: document.getElementById('f-vaga').value,
                valor: parseFloat(document.getElementById('f-valor').value) || Infinity,
                area: parseInt(document.getElementById('f-area').value) || 0,
                status: [...document.querySelectorAll('.chk-status:checked')].map(c => c.value),
                indisp: document.getElementById('chk-indisp').checked,
                ordem: document.getElementById('f-ordem').value
            };

            let filtrados = imoveis.filter(i => {
                const statusEfetivo = i.disponivel === 'Não' ? 'Indisponível' : i.status;
                if (f.cidade && i.cidade !== f.cidade) return false;
                if (f.bairro && i.bairro !== f.bairro) return false;
                if (f.construtora && i.construtora !== f.construtora) return false;
                if (f.nome && !i.empreendimento.toLowerCase().includes(f.nome)) return false;
                if (f.dorm === "4" ? i.dorm < 4 : (f.dorm && i.dorm != f.dorm)) return false;
                if (f.suite === "4" ? i.suite < 4 : (f.suite && i.suite != f.suite)) return false;
                if (f.vaga === "4" ? i.vaga < 4 : (f.vaga && i.vaga != f.vaga)) return false;
                if (i.valor > f.valor || i.area < f.area) return false;
                if (statusEfetivo === 'Indisponível') return f.indisp;
                return f.status.includes(statusEfetivo);
            });

            filtrados.sort((a, b) => {
                if (f.ordem === 'p-menor') return a.valor - b.valor;
                if (f.ordem === 'p-maior') return b.valor - a.valor;
                if (f.ordem === 'a-maior') return b.area - a.area;
                return a.empreendimento.localeCompare(b.empreendimento);
            });

            document.getElementById('counter').innerText = filtrados.length;
            render(filtrados);
        }

        function render(lista) {
            const grid = document.getElementById('grid-imoveis');
            grid.innerHTML = lista.map(i => {
                const m2 = i.valor / i.area;
                const statusColor = i.disponivel === 'Não' ? 'bg-slate-400' : (i.status === 'Lançamento' ? 'bg-emerald-500' : (i.status === 'Pronto' ? 'bg-blue-500' : 'bg-orange-500'));
                
                return `
                <div class="bg-white rounded-[2rem] card-entry shadow-xl border border-slate-100 overflow-hidden flex flex-col ${i.disponivel === 'Não' ? 'grayscale opacity-60' : ''}">
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div class="max-w-[70%]">
                                <h4 class="font-black text-slate-800 text-lg uppercase tracking-tighter leading-tight">${i.empreendimento}</h4>
                                <p class="text-[9px] text-slate-400 font-bold uppercase mt-1">${i.bairro} • ${i.cidade}</p>
                            </div>
                            <span class="${statusColor} text-white text-[8px] font-black px-2.5 py-1 rounded-full uppercase">${i.disponivel === 'Não' ? 'Indisponível' : i.status}</span>
                        </div>

                        <div class="grid grid-cols-4 gap-2 mb-6">
                            <div class="text-center bg-slate-50 py-2 rounded-xl border border-slate-100"><p class="text-[7px] text-slate-400 font-bold uppercase">Dorm</p><p class="text-xs font-black">${i.dorm}</p></div>
                            <div class="text-center bg-slate-50 py-2 rounded-xl border border-slate-100"><p class="text-[7px] text-slate-400 font-bold uppercase">Suítes</p><p class="text-xs font-black">${i.suite}</p></div>
                            <div class="text-center bg-slate-50 py-2 rounded-xl border border-slate-100"><p class="text-[7px] text-slate-400 font-bold uppercase">Vagas</p><p class="text-xs font-black">${i.vaga}</p></div>
                            <div class="text-center bg-slate-50 py-2 rounded-xl border border-slate-100"><p class="text-[7px] text-slate-400 font-bold uppercase">Planta</p><p class="text-xs font-black">${i.area}m²</p></div>
                        </div>

                        <div class="flex justify-between items-end mb-5 border-b border-slate-50 pb-4">
                            <div>
                                <p class="text-[8px] text-slate-400 font-black uppercase">A partir de</p>
                                <h3 class="text-xl font-black text-blue-600">R$ ${i.valor.toLocaleString('pt-BR')}</h3>
                                <p class="text-[9px] text-slate-300 font-bold">${m2.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}/m²</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[8px] text-slate-400 font-black uppercase">Entrega</p>
                                <p class="text-[10px] font-black text-slate-700">${i.prazo || 'Pronto'}</p>
                            </div>
                        </div>

                        <!-- NEONS CONDICIONAIS -->
                        <div class="flex gap-2 mb-6 min-h-[24px]">
                            ${i.decorado === 'Sim' ? '<span class="neon-decorado bg-emerald-50 text-emerald-700 text-[8px] font-black px-3 py-1 rounded-full uppercase tracking-widest"><i class="fa-solid fa-check mr-1"></i>Decorado</span>' : ''}
                            ${i.modelo === 'Sim' ? '<span class="neon-modelo bg-purple-50 text-purple-700 text-[8px] font-black px-3 py-1 rounded-full uppercase tracking-widest"><i class="fa-solid fa-star mr-1"></i>Modelo</span>' : ''}
                        </div>

                        <div class="flex gap-2">
                            <a href="${i['link empreendimento']}" target="_blank" class="flex-1 bg-slate-900 text-white text-center py-3 rounded-2xl text-[9px] font-black uppercase tracking-widest">Site</a>
                            ${i.book ? `<a href="${i.book}" target="_blank" class="flex-1 bg-blue-50 text-blue-600 text-center py-3 rounded-2xl text-[9px] font-black uppercase tracking-widest border border-blue-100 italic">Book PDF</a>` : ''}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function limpar() { location.reload(); }
        carregar();
    </script>
</body>
</html>
