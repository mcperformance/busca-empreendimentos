<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sotere Imóveis | Buscador de Empreendimentos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F8F9FA; --surface:#FFFFFF; --surface2:#F1F3F5;
    --border:#E9ECEF; --text:#212529; --text2:#495057; --text3:#ADB5BD;
    --accent:#1A3A2A; --accent-hover:#11271C; --accent-light:#EAF2EC;
    --whatsapp:#25D366;
    --radius:12px; --shadow:0 10px 15px -3px rgba(0,0,0,0.1);
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans', sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }

  /* Header Modernizado */
  header { 
    background: rgba(26, 58, 42, 0.95); 
    backdrop-filter: blur(10px);
    color:#fff; padding:0 5%; height:70px; 
    display:flex; align-items:center; justify-content:space-between; 
    position:sticky; top:0; z-index:1000;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  }
  .h-title { font-family:'DM Serif Display', serif; font-size:22px; }
  
  .btn-sync { 
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: white; padding: 8px 16px; border-radius: var(--radius); cursor: pointer;
    transition: 0.3s; font-size: 13px;
  }
  .btn-sync:hover { background: rgba(255,255,255,0.2); }

  .container { max-width:1400px; margin:20px auto; padding:0 20px; display:grid; grid-template-columns:300px 1fr; gap:30px; }

  /* Sidebar Estilizada */
  .sidebar { 
    background:var(--surface); border-radius:var(--radius); padding:25px; 
    box-shadow:var(--shadow); height: fit-content; position: sticky; top: 90px;
  }
  .sidebar h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-bottom: 20px; }
  
  .fg { margin-bottom:15px; }
  .fg label { display:block; font-size:12px; font-weight:700; margin-bottom:5px; color: var(--text2); }
  input, select { 
    width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; 
    background:var(--bg); font-family: inherit; font-size: 14px;
  }

  /* Grid de Cards */
  .cards-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap:20px; }

  /* Estilo do Card Premium */
  .card { 
    background:var(--surface); border-radius:var(--radius); overflow:hidden;
    box-shadow: var(--shadow); transition: transform 0.3s ease; border: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-5px); }
  
  .card-content { padding: 20px; flex-grow: 1; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-nome { font-family:'DM Serif Display', serif; font-size: 18px; color: var(--accent); }
  
  .badge { font-size:10px; font-weight:700; padding:4px 10px; border-radius:50px; text-transform: uppercase; }
  .badge-pronto { background:#E7F5FF; color:#1098AD; }
  .badge-obra { background:#FFF9DB; color:#F08C00; }
  .badge-lancamento { background:#EBFBEE; color:#2B8A3E; }

  .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; padding: 15px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .spec-item { font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--text2); }

  .price-tag { margin-top: auto; }
  .price-label { font-size: 11px; color: var(--text3); }
  .price-value { font-size: 22px; font-weight: 700; color: var(--text); }

  .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px 20px 20px; }
  .btn { 
    text-decoration: none; text-align: center; padding: 10px; border-radius: 8px; 
    font-size: 13px; font-weight: 600; transition: 0.2s;
  }
  .btn-site { background: var(--accent-light); color: var(--accent); }
  .btn-site:hover { background: var(--accent); color: white; }
  .btn-whatsapp { background: var(--whatsapp); color: white; border: none; cursor: pointer; }
  .btn-whatsapp:hover { opacity: 0.9; }

  /* Mobile */
  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
    .sidebar { position: static; margin-bottom: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="h-title">Sotere Imóveis</div>
  <button class="btn-sync" onclick="carregarPlanilha()">↻ Sincronizar Dados</button>
</header>

<div class="container">
  <aside class="sidebar">
    <h2>Filtros Avançados</h2>
    <div class="fg">
      <label>Buscar por nome</label>
      <input type="text" id="f-nome" placeholder="Ex: Lê Rêve..." oninput="buscar()">
    </div>
    <div class="fg">
      <label>Cidade</label>
      <select id="f-cidade" onchange="buscar()"><option value="">Todas</option></select>
    </div>
    <div class="fg">
        <label>Status</label>
        <select id="f-status" onchange="buscar()">
            <option value="">Todos</option>
            <option value="Lançamento">Lançamento</option>
            <option value="Em obra">Em obra</option>
            <option value="Pronto">Pronto</option>
        </select>
      </div>
    <div class="fg">
      <label>Dormitórios</label>
      <select id="f-dorms" onchange="buscar()">
        <option value="">Qualquer</option>
        <option value="1">1 dorm</option>
        <option value="2">2 dorms</option>
        <option value="3">3 dorms</option>
        <option value="4">4+ dorms</option>
      </select>
    </div>
    <div class="fg">
      <label>Valor Máximo</label>
      <input type="number" id="f-valor" placeholder="R$ 1.000.000" oninput="buscar()">
    </div>
    <button style="width:100%; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:10px" onclick="limpar()">Limpar Tudo</button>
  </aside>

  <main>
    <div class="cards-header">
      <div id="resumo" style="font-weight: 500; color: var(--text2);">Carregando...</div>
      <select id="f-ordem" onchange="buscar()" style="width: auto;">
        <option value="nome">Ordenar: A-Z</option>
        <option value="valor-asc">Menor Preço</option>
        <option value="valor-desc">Maior Preço</option>
      </select>
    </div>
    <div class="cards" id="cards-grid"></div>
  </main>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3hyyGVCdrDnwRw0jq6AzUBvZtuuUxGswfYuMhWvBvUoA7wsMZRt2hNq3PdxFLd3nv8M7Sxm0MTLyN/pub?output=csv';
let dados = [];

async function carregarPlanilha() {
    try {
        const resp = await fetch(CSV_URL);
        const csvText = await resp.text();
        const linhas = csvText.split('\n').map(l => l.split(','));
        
        // Mapeamento simples (ajuste os índices conforme sua planilha real)
        dados = linhas.slice(1).map(row => ({
            nome: row[0]?.replace(/"/g,''),
            cidade: row[1],
            bairro: row[2],
            dorms: parseInt(row[3]) || 0,
            area: row[6],
            valor: parseFloat(row[7]?.replace(/[^\d]/g,'')) || 0,
            status: row[9]?.trim(),
            link: row[13]?.replace(/"/g,'')
        })).filter(d => d.nome);

        popularCidades();
        buscar();
    } catch (e) {
        console.error("Erro ao carregar:", e);
    }
}

function popularCidades() {
    const lista = [...new Set(dados.map(d => d.cidade))].sort();
    const select = document.getElementById('f-cidade');
    lista.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
}

function buscar() {
    const nome = document.getElementById('f-nome').value.toLowerCase();
    const cidade = document.getElementById('f-cidade').value;
    const status = document.getElementById('f-status').value;
    const dorms = document.getElementById('f-dorms').value;
    const valorMax = parseFloat(document.getElementById('f-valor').value) || Infinity;
    const ordem = document.getElementById('f-ordem').value;

    let filtrados = dados.filter(d => {
        return (d.nome.toLowerCase().includes(nome)) &&
               (!cidade || d.cidade === cidade) &&
               (!status || d.status === status) &&
               (!dorms || d.dorms >= parseInt(dorms)) &&
               (d.valor <= valorMax);
    });

    if(ordem === 'valor-asc') filtrados.sort((a,b) => a.valor - b.valor);
    if(ordem === 'valor-desc') filtrados.sort((a,b) => b.valor - a.valor);

    renderizar(filtrados);
}

function shareWhatsapp(nome, valor, link) {
    const msg = encodeURIComponent(`Olá! Veja esse empreendimento que encontrei:\n\n*${nome}*\nValor: R$ ${valor.toLocaleString('pt-BR')}\n\nSaiba mais: ${link}`);
    window.open(`https://wa.me/?text=${msg}`);
}

function renderizar(lista) {
    const grid = document.getElementById('cards-grid');
    document.getElementById('resumo').innerText = `${lista.length} imóveis encontrados`;
    
    grid.innerHTML = lista.map(d => `
        <div class="card">
            <div class="card-content">
                <div class="card-header">
                    <h3 class="card-nome">${d.nome}</h3>
                    <span class="badge badge-${d.status?.toLowerCase().replace(' ','')}">${d.status}</span>
                </div>
                <p style="font-size:12px; color:var(--text3)">📍 ${d.bairro}, ${d.cidade}</p>
                
                <div class="specs">
                    <div class="spec-item">🛏️ ${d.dorms} Dorms</div>
                    <div class="spec-item">📐 ${d.area}m² úteis</div>
                </div>

                <div class="price-tag">
                    <p class="price-label">A partir de</p>
                    <p class="price-value">R$ ${d.valor.toLocaleString('pt-BR')}</p>
                </div>
            </div>
            <div class="card-actions">
                <a href="${d.link}" target="_blank" class="btn btn-site">Ver Detalhes</a>
                <button onclick="shareWhatsapp('${d.nome}', ${d.valor}, '${d.link}')" class="btn btn-whatsapp">Enviar Whats</button>
            </div>
        </div>
    `).join('');
}

function limpar() {
    document.querySelectorAll('input, select').forEach(i => i.value = '');
    buscar();
}

carregarPlanilha();
</script>
</body>
</html>
