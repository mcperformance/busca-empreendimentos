<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Marcelo Conti | Facilitador Imobiliário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-g: #4ade80; --neon-p: #a855f7; }
        .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        
        .neon-decorado { box-shadow: 0 0 12px var(--neon-g); animation: pulse-g 2s infinite; }
        .neon-modelo { box-shadow: 0 0 12px var(--neon-p); animation: pulse-p 2s infinite; }
        
        @keyframes pulse-g { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.02); opacity: 0.8; } }
        @keyframes pulse-p { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.02); opacity: 0.8; } }

        .icon-box { background: #f8fafc; border-radius: 1.5rem; transition: all 0.3s; border: 1px solid #f1f5f9; }
        .card-shadow { box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05); }
        
        /* Prevenção de zoom no mobile */
        input, select { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans leading-tight">

    <!-- CABEÇALHO MARCELO CONTI -->
    <header class="hero-gradient text-white py-12 pb-24">
        <div class="container mx-auto px-6 text-center md:text-left">
            <h1 class="text-3xl md:text-5xl font-black tracking-tighter uppercase">
                Portal <span class="text-blue-400">| Marcelo Conti</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-lg font-medium mt-3 max-w-2xl mx-auto md:mx-0">
                Um verdadeiro facilitador na hora de buscar opções para meus clientes.
            </p>
        </div>
    </header>

    <!-- FILTROS -->
    <section class="container mx-auto -mt-16 px-4">
        <div class="bg-white rounded-[2.5rem] card-shadow p-6 md:p-10 border border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Cidade</label>
                    <select id="f-cidade" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"></select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Bairro</label>
                    <select id="f-bairro" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"><option value="">Todos</option></select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Construtora</label>
                    <select id="f-construtora" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"></select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Empreendimento</label>
                    <input type="text" id="f-nome" placeholder="Buscar por nome..." class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-5 gap-3 pt-6 border-t border-slate-50">
                <select id="f-dorm" class="p-3 border-none rounded-xl font-bold bg-slate-50 text-xs shadow-inner"><option value="">Dorms</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
                <select id="f-suite" class="p-3 border-none rounded-xl font-bold bg-slate-50 text-xs shadow-inner"><option value="">Suítes</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
                <select id="f-vaga" class="p-3 border-none rounded-xl font-bold bg-slate-50 text-xs shadow-inner"><option value="">Vagas</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
                <input type="number" id="f-valor" placeholder="Valor Máx" class="p-3 border-none rounded-xl font-bold bg-slate-50 text-xs shadow-inner">
                <input type="number" id="f-area" placeholder="m² Mínimo" class="p-3 border-none rounded-xl font-bold bg-slate-50 text-xs shadow-inner">
            </div>

            <div class="mt-8 flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex flex-wrap justify-center gap-2">
                    <label class="flex items-center gap-2 text-[9px] font-black uppercase bg-slate-50 px-4 py-2 rounded-full border border-slate-100 cursor-pointer"><input type="checkbox" value="Lançamento" class="chk-status" checked> Lançamento</label>
                    <label class="flex items-center gap-2 text-[9px] font-black uppercase bg-slate-50 px-4 py-2 rounded-full border border-slate-100 cursor-pointer"><input type="checkbox" value="Em obra" class="chk-status" checked> Em obra</label>
                    <label class="flex items-center gap-2 text-[9px] font-black uppercase bg-slate-50 px-4 py-2 rounded-full border border-slate-100 cursor-pointer"><input type="checkbox" value="Pronto" class="chk-status" checked> Pronto</label>
                    <label class="flex items-center gap-2 text-[9px] font-black uppercase bg-slate-50 px-4 py-2 rounded-full border border-slate-100 text-slate-400 opacity-60"><input type="checkbox" id="chk-indisp"> Indisponíveis</label>
                </div>
                <div class="flex w-full md:w-auto gap-3">
                    <button onclick="limpar()" class="flex-1 md:w-32 bg-slate-100 text-slate-500 font-black px-6 py-4 rounded-2xl text-[10px] uppercase tracking-widest hover:bg-slate-200">Limpar</button>
                    <button onclick="filtrarEOrdenar()" class="flex-[2] md:w-48 bg-blue-600 text-white font-black px-10 py-4 rounded-2xl text-[10px] uppercase tracking-widest shadow-lg shadow-blue-100">Buscar Agora</button>
                </div>
            </div>
        </div>
    </section>

    <!-- RESULTADOS -->
    <section class="container mx-auto px-4 mt-12 mb-8">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <h2 class="text-xs font-black uppercase tracking-[0.2em] text-slate-400">Resultados: <span id="counter" class="text-blue-600">0</span> imóveis</h2>
            <select id="f-ordem" class="bg-white border-none shadow-sm rounded-xl px-4 py-2 text-[10px] font-black uppercase outline-none cursor-pointer">
                <option value="nome">Ordem Alfabética</option>
                <option value="p-menor">Menor Preço</option>
                <option value="p-maior">Maior Preço</option>
                <option value="a-maior">Maior Área</option>
            </select>
        </div>
    </section>

    <main class="container mx-auto px-4 pb-20">
        <div id="grid-imoveis" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT3hyyGVCdrDnwRw0jq6AzUBvZtuuUxGswfYuMhWvBvUoA7wsMZRt2hNq3PdxFLd3nv8M7Sxm0MTLyN/pub?gid=0&single=true&output=csv';
        let imoveis = [];

        async function carregar() {
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const linhas = text.split('\n').filter(l => l.trim());
                const cabecalho = linhas[0].toLowerCase().split(',').map(h => h.trim().replace(/"/g, ''));
                
                imoveis = linhas.slice(1).map(linha => {
                    const col = linha.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    let obj = {};
                    cabecalho.forEach((h, i) => {
                        let v = (col[i] || "").replace(/"/g, '').trim();
                        if (['dorm','suite','vaga','area'].includes(h)) obj[h] = parseInt(v) || 0;
                        else if (h.includes('valor')) obj['valor'] = parseFloat(v.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                        else obj[h] = v;
                    });
                    return obj;
                });
                popularFiltros();
                setupEvents();
                filtrarEOrdenar();
            } catch (e) { console.error(e); }
        }

        function popularFiltros() {
            const getVals = (campo) => [...new Set(imoveis.map(i => i[campo]))].filter(Boolean).sort();
            const fill = (id, list, label) => {
                document.getElementById(id).innerHTML = `<option value="">${label}</option>` + list.map(v => `<option value="${v}">${v}</option>`).join('');
            };
            fill('f-cidade', getVals('cidade'), 'Cidades');
            fill('f-construtora', getVals('construtora'), 'Construtoras');
        }

        function setupEvents() {
            document.getElementById('f-cidade').onchange = (e) => {
                const bairros = [...new Set(imoveis.filter(i => !e.target.value || i.cidade === e.target.value).map(i => i.bairro))].filter(Boolean).sort();
                document.getElementById('f-bairro').innerHTML = '<option value="">Todos os Bairros</option>' + bairros.map(b => `<option value="${b}">${b}</option>`).join('');
                filtrarEOrdenar();
            };
            ['f-bairro', 'f-construtora', 'f-ordem', 'f-dorm', 'f-suite', 'f-vaga'].forEach(id => {
                document.getElementById(id).onchange = filtrarEOrdenar;
            });
            document.getElementById('f-nome').oninput = filtrarEOrdenar;
        }

        function filtrarEOrdenar() {
            const f = {
                cidade: document.getElementById('f-cidade').value,
                bairro: document.getElementById('f-bairro').value,
                construtora: document.getElementById('f-construtora').value,
                nome: document.getElementById('f-nome').value.toLowerCase(),
                dorm: document.getElementById('f-dorm').value,
                suite: document.getElementById('f-suite').value,
                vaga: document.getElementById('f-vaga').value,
                valor: parseFloat(document.getElementById('f-valor').value) || Infinity,
                area: parseInt(document.getElementById('f-area').value) || 0,
                status: [...document.querySelectorAll('.chk-status:checked')].map(c => c.value),
                indisp: document.getElementById('chk-indisp').checked,
                ordem: document.getElementById('f-ordem').value
            };

            let filtrados = imoveis.filter(i => {
                const statusEfetivo = i.disponivel === 'Não' ? 'Indisponível' : i.status;
                if (f.cidade && i.cidade !== f.cidade) return false;
                if (f.bairro && i.bairro !== f.bairro) return false;
                if (f.construtora && i.construtora !== f.construtora) return false;
                if (f.nome && !i.empreendimento.toLowerCase().includes(f.nome)) return false;
                if (f.dorm === "4" ? i.dorm < 4 : (f.dorm && i.dorm != f.dorm)) return false;
                if (f.suite === "4" ? i.suite < 4 : (f.suite && i.suite != f.suite)) return false;
                if (f.vaga === "4" ? i.vaga < 4 : (f.vaga && i.vaga != f.vaga)) return false;
                if (i.valor > f.valor || i.area < f.area) return false;
                if (statusEfetivo === 'Indisponível') return f.indisp;
                return f.status.includes(statusEfetivo);
            });

            filtrados.sort((a, b) => {
                if (f.ordem === 'p-menor') return a.valor - b.valor;
                if (f.ordem === 'p-maior') return b.valor - a.valor;
                if (f.ordem === 'a-maior') return b.area - a.area;
                return a.empreendimento.localeCompare(b.empreendimento);
            });

            document.getElementById('counter').innerText = filtrados.length;
            render(filtrados);
        }

        function render(lista) {
            const grid = document.getElementById('grid-imoveis');
            grid.innerHTML = lista.map(i => {
                const m2 = i.valor / i.area;
                const statusColor = i.disponivel === 'Não' ? 'bg-slate-300' : (i.status === 'Lançamento' ? 'bg-orange-500' : (i.status === 'Pronto' ? 'bg-blue-600' : 'bg-emerald-500'));
                
                return `
                <div class="bg-white rounded-[2.5rem] card-shadow overflow-hidden flex flex-col border border-slate-50 transition-all duration-300 ${i.disponivel === 'Não' ? 'grayscale opacity-50' : ''}">
                    <div class="p-8">
                        <div class="flex justify-between items-start mb-6">
                            <div class="space-y-1">
                                <h3 class="font-black text-slate-800 text-2xl tracking-tighter uppercase leading-none">${i.empreendimento}</h3>
                                <p class="text-[10px] font-bold text-red-500 uppercase tracking-widest">
                                    <i class="fa-solid fa-location-dot mr-1"></i> ${i.bairro} — ${i.cidade}
                                    ${i.prazo ? `<span class="text-slate-400 ml-2">| ${i.prazo}</span>` : ''}
                                </p>
                            </div>
                            <span class="${statusColor} text-white text-[9px] font-black px-4 py-1.5 rounded-full uppercase shadow-sm">${i.disponivel === 'Não' ? 'Indisp.' : i.status}</span>
                        </div>

                        <!-- GRID DE INFO (STILO PREMIUM) -->
                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="icon-box p-4 flex items-center gap-4">
                                <i class="fa-solid fa-bed text-blue-500 text-xl opacity-80"></i>
                                <div><p class="text-[8px] font-black text-slate-400 uppercase leading-none">Dorms</p><p class="text-lg font-black text-slate-700 leading-tight">${i.dorm}</p></div>
                            </div>
                            <div class="icon-box p-4 flex items-center gap-4">
                                <i class="fa-solid fa-sink text-orange-400 text-xl opacity-80"></i>
                                <div><p class="text-[8px] font-black text-slate-400 uppercase leading-none">Suítes</p><p class="text-lg font-black text-slate-700 leading-tight">${i.suite}</p></div>
                            </div>
                            <div class="icon-box p-4 flex items-center gap-4">
                                <i class="fa-solid fa-car text-emerald-400 text-xl opacity-80"></i>
                                <div><p class="text-[8px] font-black text-slate-400 uppercase leading-none">Vagas</p><p class="text-lg font-black text-slate-700 leading-tight">${i.vaga}</p></div>
                            </div>
                            <div class="icon-box p-4 flex items-center gap-4">
                                <i class="fa-solid fa-ruler-combined text-purple-400 text-xl opacity-80"></i>
                                <div><p class="text-[8px] font-black text-slate-400 uppercase leading-none">Planta</p><p class="text-lg font-black text-slate-700 leading-tight">${i.area}m²</p></div>
                            </div>
                        </div>

                        <div class="mb-8">
                            <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Valor a partir de:</p>
                            <div class="flex items-baseline gap-3">
                                <h4 class="text-3xl font-black text-blue-600">R$ ${i.valor.toLocaleString('pt-BR')}</h4>
                                <span class="text-slate-300 text-xs font-medium">| R$ ${m2.toLocaleString('pt-BR', {minimumFractionDigits: 2})}/m²</span>
                            </div>
                        </div>

                        <!-- CONSTRUTORA E NEONS -->
                        <div class="flex flex-wrap gap-2 mb-8">
                            <div class="bg-slate-50 text-slate-500 text-[9px] font-black px-4 py-2 rounded-xl border border-slate-100 uppercase">
                                <i class="fa-solid fa-hammer mr-2 text-slate-300"></i> ${i.construtora}
                            </div>
                            ${i.decorado === 'Sim' ? '<div class="neon-decorado bg-emerald-500 text-white text-[9px] font-black px-4 py-2 rounded-xl uppercase tracking-tighter"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Decorado</div>' : ''}
                            ${i.modelo === 'Sim' ? '<div class="neon-modelo bg-purple-500 text-white text-[9px] font-black px-4 py-2 rounded-xl uppercase tracking-tighter"><i class="fa-solid fa-eye mr-2"></i>Modelo</div>' : ''}
                        </div>

                        <div class="grid grid-cols-2 gap-3 mt-auto">
                            <a href="${i['link empreendimento']}" target="_blank" class="bg-[#0f172a] text-white text-center py-5 rounded-2xl text-[10px] font-black uppercase tracking-[0.1em] shadow-lg">Visitar Site</a>
                            ${i.book ? `<a href="${i.book}" target="_blank" class="bg-blue-50 text-blue-600 text-center py-5 rounded-2xl text-[10px] font-black uppercase tracking-[0.1em] border border-blue-100">Baixar Book</a>` : '<div class="bg-slate-50 text-slate-300 text-center py-5 rounded-2xl text-[10px] font-black uppercase border border-slate-100 opacity-50">Sem Book</div>'}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function limpar() { location.reload(); }
        carregar();
    </script>
</body>
</html>
